[package]
name = "client"
version = "0.1.0"
edition = "2021"

[dependencies]
avian3d = "0.1"
bevy = { version = "0.14.0", features = ["wav"] }
noise = "0.9.0"
rand = "0.10.2"
spacetimedb-sdk = "2.10.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
spacetime-rts-logic = { path = "../backend/logic" }
