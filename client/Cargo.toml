[package]
name = "client"
version = "0.1.0"
edition = "2021"

[lib]
name = "client"
path = "src/lib.rs"

[[bin]]
name = "client"
path = "src/main.rs"

[dependencies]
rapier3d = "0.22.0"
bevy = { version = "0.14.0", features = ["wav"] }
bevy_voxel_world = "0.9.0"
noise = "0.9.0"
rand = "0.10.2"
spacetimedb-sdk = "2.10.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
spacetime-rts-logic = { path = "../backend/logic" }
parry3d = "0.17"
# P0 Fix: Compile-time log level filtering for performance
log = { version = "0.4", features = ["max_level_debug", "release_max_level_warn"] }
